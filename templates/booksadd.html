{% extends "admin.html" %}

{% block content %}
    <form method="POST" action="/admin/viewbooks/new">
        <div id="login-input-container">
            <div class="field">
                <label for="isbn">ISBN</label>
                <input autofocus id="isbn" name="isbn">
            </div>
            <div class="field">
                <label for="title">Title</label>
                <input id="title" name="title">
            </div>
            <div class="field">
                <label for="authors">Full names of author(s) (separated by comma)</label>
                <input id="authors" name="authors">
            </div>
            <div class="field">
                <label for="subject">Subject</label>
                <input id="subject" name="subject">
            </div>
            <div class="field">
                <label for="year">Publication Year</label>
                <input id="year" name="year">
            </div>
            <div class="field">
                <label for="price">Price</label>
                <input id="price" name="price" type="number" min="0.00" step="0.01">
            </div>
            <div class="field">
                <label for="publisher">Publisher ID</label>
                <input name="publisher" id="publisher">
            </div>
        </div>
        <button class="reject" type="submit">Add</button>
        <a href="/admin/viewbooks"><button class="approve" type="button">Cancel</button></a>
    </form>
{% endblock %}
