{% extends "admin.html" %}

{% block content %}
    <div id="data">
        <div id="col-names">
            {% for col in cols %}
                <div class="col-name">{{ col }}</div>
            {% endfor %}
            <div class="col-name">Action</div>
        </div>
        {% for row in rows %}
            <div class="row" id="row">
                {% for value in row %}
                    <div>{{ value }}</div>
                {% endfor %}
                <div class="row-action">
                    <a href="/admin/memreq/approve/{{ reqIDS[loop.index0] }}"><button class="approve">Approve</button></a>
                    <a href="/admin/memreq/reject/{{ reqIDS[loop.index0] }}"><button class="reject">Reject</button></a>
                </div>
            </div>
        {% endfor %}
    </div>
{% endblock %}
