{% extends "admin.html" %}

{% block content %}
    <form method="POST" action="/admin/bookrequests/update/{{ id }}">
        <div id="login-input-container">
            <div class="field">
                <label for="status">Status</label>
                <select value="{{ status }}" id="status" name="status">
                    <option disabled selected>Select Status</option>
                    <option>Pending</option>
                    <option>Acquired</option>
                    <option>Rejected</option>
                </select>
            </div>
        </div>
        <button class="reject" type="submit">Submit</button>
        <a href="/admin/bookrequests"><button class="approve" type="button">Cancel</button></a>
    </form>
{% endblock %}
