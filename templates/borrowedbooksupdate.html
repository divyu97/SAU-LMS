{% extends "admin.html" %}

{% block content %}
    <form method="POST" action="/admin/borrowedbooks/update/{{ id }}">
        <div id="login-input-container">
            <div class="field">
                <label for="bdate">Borrow Date</label>
                <input value="{{ bdate }}" id="bdate" name="bdate" type="date">
            </div>
            <div class="field">
                <label for="ddate">Due Date</label>
                <input value="{{ ddate }}" id="ddate" name="ddate" type="date">
            </div>
            <div class="field">
                <label for="rdate">Return Date</label>
                <input value="{{ rdate }}" id="rdate" name="rdate" type="date">
            </div>
            <div class="field">
                <label for="fine">Fine Amount</label>
                <input value="{{ fine }}" id="fine" name="fine" type="number" min="0.00" step="0.01">
            </div>
        </div>
        <button class="reject" type="submit">Submit</button>
        <a href="/admin/borrowedbooks"><button class="approve" type="button">Cancel</button></a>
    </form>
{% endblock %}
