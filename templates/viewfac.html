{% extends "admin.html" %}

{% block content %}
    <a href="/admin/viewfac/new"><button class="update" style="background-color: rgb(0, 102, 255);">Add Faculty Member</button></a>
    <div id="data">
        <div id="col-names">
            {% for col in cols %}
                <div class="col-name">{{ col }}</div>
            {% endfor %}
            <div class="col-name">Action</div>
        </div>
        {% for row in rows %}
            <div class="row" id="row">
                {% for value in row %}
                    <div>{{ value }}</div>
                {% endfor %}
                <div class="row-action">
                    <a href="/admin/viewfac/update/{{ memIDS[loop.index0] }}"><button class="update">Update</button></a>
                    <a href="/admin/viewfac/remove/{{ memIDS[loop.index0] }}"><button class="remove">Remove</button></a>
                </div>
            </div>
        {% endfor %}
    </div>
{% endblock %}
