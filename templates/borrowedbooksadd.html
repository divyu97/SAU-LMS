{% extends "admin.html" %}

{% block content %}
    <form method="POST" action="/admin/borrowedbooks/new">
        <div id="login-input-container">
            <div class="field">
                <label for="copy">Copy ID</label>
                <input autofocus id="copy" name="copy">
            </div>
            <div class="field">
                <label for="member">Member ID</label>
                <input id="member" name="member">
            </div>
            <div class="field">
                <label for="bdate">Borrow Date</label>
                <input id="bdate" name="bdate" type="date">
            </div>
            <div class="field">
                <label for="ddate">Due Date</label>
                <input id="ddate" name="ddate" type="date">
            </div>
            <div class="field">
                <label for="rdate">Return Date</label>
                <input id="rdate" name="rdate" type="date">
            </div>
            <div class="field">
                <label for="fine">Fine Amount</label>
                <input id="fine" name="fine" type="number" min="0.00" step="0.01" value="0.00">
            </div>
        </div>
        <button class="reject" type="submit">Add</button>
        <a href="/admin/borrowedbooks"><button class="approve" type="button">Cancel</button></a>
    </form>
{% endblock %}
